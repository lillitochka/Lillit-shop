<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>💎 Пруфы — Lillit Shop</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #080808;
            color: white;
        }

        .top-bar {
            background: #ff4fa3;
            padding: 14px 15px;
            text-align: center;
        }

        .top-bar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            margin: 0 10px;
            font-size: 15px;
        }

        .header {
            text-align: center;
            padding: 65px 20px;
            background:
                radial-gradient(circle at top, #321326, #080808 60%);
        }

        .logo {
            font-size: 45px;
            font-weight: 800;
        }

        h1 {
            font-size: 38px;
            margin: 22px 0 12px;
        }

        .subtitle {
            color: #ddd;
            font-size: 18px;
        }

        .proofs {
            background: white;
            color: #111;
            text-align: center;
            padding: 65px 20px;
            min-height: 500px;
        }

        .proof-box {
            max-width: 650px;
            margin: 0 auto;
            background: #080808;
            color: white;
            border: 2px solid #ff4fa3;
            border-radius: 25px;
            padding: 35px 25px;
        }

        .count {
            color: #ff65ad;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .proof-text {
            font-size: 18px;
            line-height: 1.6;
            color: #ddd;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 15px 30px;
            background: #ff4fa3;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
        }

        footer {
            background: #050505;
            text-align: center;
            padding: 40px 20px;
        }

        footer a {
            color: #ff65ad;
            text-decoration: none;
        }

        @media (max-width: 700px) {
            .top-bar a {
                font-size: 12px;
                margin: 0 4px;
            }

            .logo {
                font-size: 34px;
            }

            h1 {
                font-size: 30px;
            }

            .proof-box {
                padding: 28px 17px;
            }

            .count {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <nav class="top-bar">
        <a href="index.html">Главная</a>
        <a href="catalog.html">Каталог</a>
        <a href="proofs.html">Пруфы</a>
        <a href="index.html#rules">Правила</a>
    </nav>

    <header class="header">

        <div class="logo">
            🐈 Lillit Shop 🐾
        </div>

        <h1>💎 Пруфы</h1>

        <div class="subtitle">
            Подтверждения успешных сделок
        </div>

    </header>

    <section class="proofs">

        <div class="proof-box">

            <div class="count">
                💗 300+ пруфов
            </div>

            <div class="proof-text">
                Перейдите в мой Telegram-канал и
                в поиске напишите
                <strong>#пруфы</strong>,
                чтобы посмотреть отзывы и подтверждения сделок ✨
            </div>

            <a
                class="button"
                href="https://t.me/lil1ta0"
                target="_blank">
                💬 ПЕРЕЙТИ В TELEGRAM
            </a>

        </div>

    </section>

    <footer>

        🐈 Lillit Shop 🐾

        <p>
            <a href="https://t.me/lil1ta0" target="_blank">
                💬 Telegram
            </a>
        </p>

        <p>© Lillit Shop</p>

    </footer>

</body>
</html>
