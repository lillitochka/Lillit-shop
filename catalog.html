<title>🛍️ Lillit Shop — Каталог</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Arial,sans-serif;background:#080808;color:#fff}
.top-bar{background:#ff4fa3;padding:14px 10px;text-align:center;position:sticky;top:0;z-index:20}
.top-bar a{color:#fff;text-decoration:none;font-weight:700;margin:0 9px;font-size:14px}
.top-bar a:hover{color:#111}
.page{max-width:1100px;margin:auto;padding:45px 18px}
.page-title{text-align:center;font-size:40px;margin:10px 0 10px}
.page-subtitle{text-align:center;color:#ccc;margin:0 auto 35px;line-height:1.5}
.back{display:inline-block;color:#ff65ad;text-decoration:none;font-weight:700;margin-bottom:25px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.card{background:#111;border:1px solid #333;border-radius:24px;padding:20px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.card:hover{border-color:#ff4fa3}
.card img{width:100%;height:230px;object-fit:contain;background:#fff;border-radius:18px;margin-bottom:15px}
.card h2{font-size:25px;margin:5px 0 10px}
.price{font-size:23px;font-weight:800;color:#ff65ad}
.meta{color:#ddd;line-height:1.6;margin:10px 0 18px}
.buy{display:inline-block;border:0;background:#ff4fa3;color:#fff;padding:13px 30px;border-radius:25px;font-size:16px;font-weight:800;cursor:pointer}
.buy:hover{transform:scale(1.04)}
.category{display:inline-block;padding:7px 12px;border-radius:20px;background:#242424;color:#ff9ac8;font-size:13px;font-weight:700;margin-bottom:10px}
.game-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;margin-top:30px}
.game-card{display:block;background:#111;border:2px solid #ff4fa3;border-radius:25px;padding:40px 25px;text-align:center;text-decoration:none;color:#fff}
.game-card h2{font-size:30px;margin:0 0 10px}
.game-card p{color:#ccc;line-height:1.5}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal-box{width:min(420px,100%);background:#111;border:2px solid #ff4fa3;border-radius:25px;padding:28px;text-align:center}
.modal-box h3{margin-top:0;font-size:25px}
.modal-link{display:block;background:#ff4fa3;color:#fff;text-decoration:none;padding:14px;border-radius:24px;margin:12px 0;font-weight:800}
.modal-link.secondary{background:#fff;color:#111}
.close{background:none;border:0;color:#aaa;font-size:15px;margin-top:8px;cursor:pointer}
footer{background:#050505;border-top:1px solid #222;padding:35px 18px;text-align:center;color:#ddd}
footer a{color:#ff65ad;text-decoration:none}
.footer-links{margin:15px 0;line-height:2}
@media(max-width:700px){
 .top-bar a{font-size:12px;margin:0 4px}
 .page{padding:30px 13px}
 .page-title{font-size:31px}
 .grid,.game-grid{grid-template-columns:1fr}
 .card img{height:210px}
 .card{padding:16px}
}
</style>
</head>
